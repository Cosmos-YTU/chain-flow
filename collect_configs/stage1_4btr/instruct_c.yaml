# Turkish teacher states for Qwen3.5-4B. Prompts are the chat-templated PREFIXES lifted from
# the turkishdspark corpus by scripts/build_turkish_prompts.py (built for the 27B run; the 4B
# shares Qwen3.5's tokenizer and chat template byte-for-byte, verified, so they replay verbatim).
# Continuations are generated by the REAL 4B target, so they are on-distribution -- the corpus's
# own completions came from Qwen3.6-35B-A3B-FP8 and are discarded.
model_id: Qwen/Qwen3.5-4B
dataset_name: json
data_files: bench_data_tr/tr-instructurca.train.jsonl
dataset_config: null
split: train
dataset_start: 16000
dataset_end: 24000
source: tr_instruct
format_name: pretemplated
generation_max_new_tokens: 256
generation_batch_size: 128
hidden_batch_size: 48
storage_dtype: float16
dtype: float16
device: cuda:0
output_dir: teacher_states/stage1-4btr-instruct_c
