model_id: Qwen/Qwen3.5-0.8B
local_files_only: false
device: cuda

# EAGLE-style token-feedback drafter (V2), K=4, no VAE
architecture: eagle_flow
context_size: 8
draft_length: 4
expert_dim: 1024
num_heads: 8
ffn_multiplier: 6
num_drafter_layers: 8
drafter_dropout: 0.0

# only hidden/cos/ce/accept are used by the eagle module (no flow/latent terms)
lambda_hidden: 0.5
lambda_cos: 0.1
lambda_ce: 0.3
lambda_accept: 0.15
gamma: 0.8
eps: 0.00000001

dataset_path: data/flow_cache/stage4_mix6_55k_k4
dataset_split: train
window_seed: 0
materialize_rows: true
output_dir: out/flow/ckpts/eagle-mix6-55k-k4-l8-ffn6

per_device_train_batch_size: 6144
per_device_eval_batch_size: 6144

num_train_epochs: 12
learning_rate: 0.001
lr_scheduler_type: constant
logging_strategy: epoch
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 5
report_to: none
