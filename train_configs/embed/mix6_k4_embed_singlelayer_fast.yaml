model_id: Qwen/Qwen3.5-0.8B
local_files_only: false
device: cuda

# V5: embedding-space FLOW MATCHER. Target = clean token embeddings; integrate velocity field.
architecture: embed_flow
context_size: 8
draft_length: 4
expert_dim: 1024
context_feature_dim: 1024
num_heads: 8
ffn_multiplier: 6
num_drafter_layers: 8
num_flow_steps: 4
init_mode: noise
noise_scale: 0.6

lambda_flow: 1.0
lambda_hidden: 0.5
lambda_ce: 0.3
lambda_accept: 0.15
gamma: 0.8
eps: 0.00000001

dataset_path: data/flow_cache/stage4_mix6_55k_k4
dataset_split: train
windows_per_epoch: 400000
window_seed: 0
materialize_rows: true
output_dir: out/flow/ckpts/embed-flow-mix6-55k-k4-l8-ffn6-singlelayer

per_device_train_batch_size: 6144
per_device_eval_batch_size: 6144

num_train_epochs: 8
learning_rate: 0.001
lr_scheduler_type: constant
logging_strategy: epoch
logging_steps: 10
eval_strategy: "no"
save_strategy: epoch
save_total_limit: 5
report_to: none
