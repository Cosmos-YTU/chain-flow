model_id: Qwen/Qwen3.5-0.8B
local_files_only: false
device: cuda

# V5: embedding-space FLOW MATCHER. Target = clean token embeddings; integrate velocity field.
architecture: embed_flow
context_size: 8
draft_length: 4
expert_dim: 1024
context_feature_dim: 1024
num_heads: 8
ffn_multiplier: 6
num_drafter_layers: 8
num_flow_steps: 4
init_mode: noise
noise_scale: 0.6

lambda_flow: 0.2
lambda_hidden: 0.0
lambda_ce: 0.1
lambda_dist: 0.9
pos_decay: 4.0
lambda_accept: 0.0
gamma: 0.8
eps: 0.00000001

dataset_path: data/flow_cache/stage4_mix6_55k_k4
dataset_split: train
window_seed: 0
materialize_rows: true
output_dir: out/flow/ckpts/embed-flow-mix6-55k-k4-l8-ffn6-singlelayer-distloss

per_device_train_batch_size: 6144
per_device_eval_batch_size: 6144

num_train_epochs: 12
learning_rate: 0.001
lr_scheduler_type: constant
logging_strategy: steps
logging_steps: 200
eval_strategy: steps
eval_steps: 8000
save_strategy: steps
save_steps: 8000
save_total_limit: 4
report_to: none