# One-step-lagged context: train for what the vLLM proposer can actually supply at
# draft time -- h(t-1) plus the committed token t -- instead of h(t), which vLLM never
# computes in that step. Same v1 data, same targets; only the context construction changes.
lag_context: true

# No-eviction: append the token-derived slot to the FULL context (9 positions) instead of
# dropping h[t-C]. VAE supports 16 positions, so this is architecturally free and strictly more
# information than either the plugin arm or the evicting lag variant.
lag_extend: true
