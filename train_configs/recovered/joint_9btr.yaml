model_id: Qwen/Qwen3.5-9B
context_size: 8
draft_length: 8
chunk_size: 4
expert_dim: 1024
num_heads: 8
ffn_multiplier: 6
num_drafter_layers: 8
num_flow_steps: 2
init_mode: delta
detach_previous_chunks: true
markov_rank: 256
path_order: 8
path_ffn_multiplier: 2
lambda_cov: 0.3
cov_b: 8
cov_margin: 1.0
tree_top_b: 8
tree_max_nodes: 64
architecture: tree_flow
device: cuda
vae_dir: /home/shadeform/chained-flow/out/vae/ckpts/transformer-hidden-9bx-4096-latent1024-fp16
latent_size: 1024
vae_type: transformer_hidden
vae_intermediate_size: 3072
vae_num_layers: 2
vae_num_heads: 8
vae_max_sequence_length: 16
train_vae: true
lambda_vae_recon: 0.5
# WARM START. Architecture above is byte-identical to v2's chained_flow_tree_config.json, so every
# tensor matches by name and shape; the run prints the sha256 of the file it actually loaded.
# vae_dir above only CONSTRUCTS the VAE module -- its weights are overwritten from init_from, which
# carries the jointly-trained VAE (64 of the 426 tensors).
init_from: selimaktas/Flow-Drafter-9B-v2
dataset_path: data/flow_cache/stage1_9btr_mix_k4
dataset_split: train
materialize_rows: true
lambda_flow: 0.2
lambda_hidden: 0.25
lambda_cos: 0.1
lambda_ce: 0.3
lambda_accept: 0.15
gamma: 0.8
output_dir: out/flow/ckpts/tree-vae-joint-9btr-1024-k8-l8
# Fine-tune, not a from-scratch run: 1/3 of v2's LR and 6 epochs instead of 15. A warm start that
# keeps v2's 5e-4 for 15 epochs over a 77%-Turkish set is how English gets overwritten.
learning_rate: 0.00015
num_train_epochs: 6
per_device_train_batch_size: 512
gradient_accumulation_steps: 24
lr_scheduler_type: constant
save_steps: 400
logging_steps: 25
save_total_limit: 2
dataloader_num_workers: 4
report_to: none
bf16: true
