# Turkish 4B flow drafter -- warm-started from selimaktas/Flow-Drafter-4B-v2.
#
# Every model_arg down to `lambda_vae_recon` is byte-identical to train_configs/recovered/
# joint_4bx.yaml (the v2 recipe). That is not stylistic: warm_start_from() matches tensors by
# name+shape, so any architecture drift here would silently leave those tensors random and the run
# would be a from-scratch train wearing a warm-start config.
model_id: Qwen/Qwen3.5-4B
context_size: 8
draft_length: 8
chunk_size: 4
expert_dim: 640
num_heads: 8
ffn_multiplier: 6
num_drafter_layers: 8
num_flow_steps: 2
init_mode: delta
detach_previous_chunks: true
markov_rank: 256
path_order: 8
path_ffn_multiplier: 2
lambda_cov: 0.3
cov_b: 8
cov_margin: 1.0
tree_top_b: 8
tree_max_nodes: 64
architecture: tree_flow
device: cuda
vae_dir: /home/shadeform/chained-flow/out/vae/ckpts/transformer-hidden-4bx-2560-latent640-fp16
latent_size: 640
vae_type: transformer_hidden
vae_intermediate_size: 1920
vae_num_layers: 2
vae_num_heads: 8
vae_max_sequence_length: 16
train_vae: true
lambda_vae_recon: 0.5

# WARM START. This local dir is byte-identical to the published v2 snapshot -- both
# model.safetensors files hash to
#   sha256 7a06e317d4a6c8648dd836b8ae92be462d8d97a4bcaf83739a644cf2121f3779
# (verified against ~/.cache/huggingface/hub/models--selimaktas--Flow-Drafter-4B-v2/snapshots/
#  9c3962cc7a3b5e6129053ba5da235a0296b6c795/model.safetensors). warm_start_from() re-prints that
# digest at startup -- check the LOG, not this comment. `vae_dir` above only CONSTRUCTS the VAE
# module; its weights are then overwritten from init_from, which carries the jointly-trained VAE.
init_from: /home/shadeform/chained-flow/out/flow/ckpts/tree-vae-joint-4bx-640-k8-l8

dataset_path: data/flow_cache/stage1_4btr_mix_k4
dataset_split: train
materialize_rows: true

lambda_flow: 0.2
lambda_hidden: 0.25
lambda_cos: 0.1
lambda_ce: 0.3
lambda_accept: 0.15
gamma: 0.8

output_dir: out/flow/ckpts/tree-vae-joint-4btr-640-k8-l8
# Fine-tune, not a from-scratch run: v2 trained at 5e-4 for 15 epochs on 8.1M English tokens.
# Keeping that LR and epoch budget over a ~75%-Turkish set is how English gets overwritten, so
# this drops to 1.5e-4 -- the same 1/3-of-v2 ratio the 9B Turkish run used.
learning_rate: 0.00015
# 2, not the 9B run's 6. v2's own numbers set the budget: 60,467 s for 15 epochs over 9.2M windows
# on TWO GPUs = ~2.7 s/step at 6144 windows/step, so ~5.4 s/step on the single GPU this run is
# restricted to. At ~10.9M windows that is ~5.3 h for 2 epochs and ~16 h for 6 -- and 16 h does not
# fit the deadline. 2 epochs x 9.6M tokens = 19M token-updates against the 27B Turkish run's
# 3 x 15.1M = 45M; less, but this is the smallest of the three models adapting from an already
# converged parent, and a run that FINISHES beats a longer one that gets truncated.
num_train_epochs: 2
# 512 x 12 on ONE GPU = 6144 windows/step, exactly v2's 512 x 6 x 2 GPUs, so the optimisation
# dynamics stay comparable to the parent's despite the single-device budget.
per_device_train_batch_size: 512
gradient_accumulation_steps: 12
lr_scheduler_type: constant
save_steps: 400
logging_steps: 25
save_total_limit: 2
dataloader_num_workers: 4
report_to: none
bf16: true
