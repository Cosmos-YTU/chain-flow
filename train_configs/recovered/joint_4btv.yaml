# P1: TOTAL-VARIATION loss. Under rejection sampling the acceptance rate IS the distributional
# overlap, alpha = sum_v min(p_v,q_v) = 1 - d_TV, so this optimises accept DIRECTLY where CE only
# does so indirectly. DSpark trains {ce:0.1, tv:0.9}. pos_decay flattens the depth weighting
# (exp(-i/4) vs our 0.8^i, which under-weights exactly the deep positions where accept is lost).
lambda_dist: 0.9
pos_decay: 4.0
