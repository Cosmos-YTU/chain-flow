# Turkish v2 = SAME recipe as v1, MORE DATA. 29,100 -> 56,699 rows (~12.9M -> ~29.5M tokens).
#
# Warm-started from the ENGLISH v2 parent, exactly as v1 was -- NOT from the shipped Turkish
# checkpoint. That keeps v1-vs-v2 a clean test of the added data instead of confounding it with
# extra epochs on the old rows, which we already know are saturated: in-distribution TR plateaued
# at ~0.7 epochs while out-of-distribution TRO kept climbing to ~2.5.
#
# 3 epochs with DENSE checkpointing, because the v1 sweep showed the two Turkish axes saturate at
# very different points and only a per-checkpoint ladder can find the knee. save_total_limit is
# deliberately ABOVE the checkpoint count: a limit below it silently deletes the band the ladder
# needs and leaves a plausible curve that cannot locate the optimum.
