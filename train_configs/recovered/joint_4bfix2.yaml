# TRAIN/INFERENCE ALIGNMENT FIXES (both were genuine divergences, see memory)
# 1. prev_token_cond: _parent_stack only ever saw future_tokens, so the last COMMITTED token was
#    masked out as an ancestor at EVERY position (the (p,p) diagonal) -- position 0 got no path
#    conditioning at all, and the markov bias there was zeroed. Inference meanwhile feeds exactly
#    that token via `known0`. Accept is a prefix, so position 0 is the highest-leverage slot.
# 2. sched_sampling_p: training conditioned the path residual / markov bias on the TRUE future
#    tokens while inference feeds the beam's OWN predictions back (logit.ce 0.05 vs ce_base 0.81).
prev_token_cond: true
sched_sampling_p: 0.0
# ABLATION: prev_token_cond ONLY (scheduled sampling OFF). The combined run scored 2.25 vs the
# 2.36 baseline -- worse. This isolates which change caused it. Suspicion is scheduled sampling:
# p=0.25 held CONSTANT (no ramp) mixes the model's own MARGINAL argmax -- a weak predictor at 4B --
# into the path/markov conditioning, injecting a lot of wrong-token conditioning during training.
# prev_token_cond is strictly-more-information and is hard to see hurting on its own.
