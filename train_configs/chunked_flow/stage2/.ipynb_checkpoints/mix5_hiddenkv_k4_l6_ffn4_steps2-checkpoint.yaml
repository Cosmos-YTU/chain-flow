model_id: Qwen/Qwen3.5-0.8B
local_files_only: false
device: cuda

# no-VAE hidden-KV drafter (operates directly in 1024-d hidden space)
architecture: hidden_kv_flow
vae_dir: null
train_vae: false
context_size: 8
draft_length: 4
chunk_size: 4
expert_dim: 1024
num_heads: 8
ffn_multiplier: 4
num_drafter_layers: 6
num_flow_steps: 2
init_mode: delta
detach_previous_chunks: true
drafter_dropout: 0.0
noise_scale: 1.0

lambda_flow: 0.2
lambda_latent: 0.15
lambda_hidden: 0.25
lambda_cos: 0.05
lambda_ce: 0.2
lambda_accept: 0.15
gamma: 0.8
eps: 0.00000001

dataset_path: data/flow_cache/stage1_mix5_26k_k4
dataset_split: train
window_seed: 0
materialize_rows: true
output_dir: out/flow/ckpts/stage2-mix5-26k-hiddenkv-k4-l6-ffn4-steps2-lr1e3

per_device_train_batch_size: 8192
per_device_eval_batch_size: 8192

num_train_epochs: 30
learning_rate: 0.001
lr_scheduler_type: constant
logging_strategy: epoch
logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 5
report_to: none
